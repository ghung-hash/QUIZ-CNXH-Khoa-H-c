<title>Quiz chủ nghĩa xã hội Khoa học</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#222;--mu:#777;--bd:#ddd;--ac:#b3261e;--ok:#1b7f3b;--okb:#e3f4e8;--no:#c62828;--nob:#fde7e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--card:#272729;--tx:#eee;--mu:#aaa;--bd:#444;--ok:#6fd48c;--okb:#1d3a27;--no:#ff8a80;--nob:#432424;--ac:#ff8a80}}
:root[data-theme="dark"]{--bg:#1b1b1d;--card:#272729;--tx:#eee;--mu:#aaa;--bd:#444;--ok:#6fd48c;--okb:#1d3a27;--no:#ff8a80;--nob:#432424;--ac:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:640px;margin:0 auto;padding:16px}
.c{-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);background:color-mix(in srgb,var(--card) 50%,transparent);border:1px solid var(--bd);border-radius:14px;padding:18px}
h1{font-size:16px;margin:0 0 6px;color:var(--ac)}h2{font-size:18px;margin:0 0 14px}
.m{color:var(--mu);font-size:14px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.o{display:block;width:100%;text-align:left;background:color-mix(in srgb,var(--card) 45%,transparent);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.o b{display:inline-block;width:24px;color:var(--ac)}
.o.ok{border-color:var(--ok);background:var(--okb)}.o.no{border-color:var(--no);background:var(--nob)}
.e{margin-top:12px;padding:12px;border-radius:10px;background:var(--okb);border-left:4px solid var(--ok);font-size:15px}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px;width:100%}
.qb{padding-bottom:16px;margin-bottom:16px;border-bottom:1px dashed var(--bd)}.qb h2{font-size:17px}.big{font-size:44px;font-weight:700;color:var(--ac);margin:8px 0}

"Phạm trù nào là phạm trù trọng tâm, nguyên lý xuất phát của chủ nghĩa xã hội khoa học, cũng là trọng điểm đấu tranh của tư tưởng lý luận trong thời đại ngày nay?|Sứ mệnh lịch sử của giai cấp công nhân|Hình thái kinh tế - xã hội|Giá trị thặng dư|Liên minh giai cấp|Sứ mệnh lịch sử của giai cấp công nhân là nội dung cốt lõi, điểm xuất phát của chủ nghĩa xã hội khoa học, nên cũng là nơi đấu tranh tư tưởng gay gắt nhất.",

"Luận điểm: \"Nếu giai cấp công nhân không liên minh được với người bạn đồng minh tự nhiên của mình là giai cấp nông dân thì bài đồng ca cách mạng của giai cấp công nhân sẽ trở thành bài đơn ca ai điếu\" là của ai?|C.Mác|Lênin|Hồ Chí Minh|Ph.Ăngghen|Đây là luận điểm của C.Mác: ở nước có đông nông dân, nếu giai cấp công nhân không liên minh với nông dân thì cách mạng khó thắng lợi, tiếng nói của giai cấp công nhân sẽ cô độc.",

"Sự chuyển biến lập trường triết học và chính trị của C.Mác và Ph.Ăngghen những năm 1843 - 1848 là?|Từ thế giới quan duy tâm sang duy vật, từ lập trường dân chủ cách mạng sang lập trường cộng sản chủ nghĩa|Từ duy vật sang duy tâm, từ cộng sản sang dân chủ cách mạng|Giữ nguyên thế giới quan duy tâm|Từ chủ nghĩa cộng sản sang chủ nghĩa tư bản|Trong giai đoạn 1843 - 1848, Mác và Ăngghen chuyển từ duy tâm sang duy vật, từ dân chủ cách mạng sang lập trường cộng sản, chuẩn bị nền tảng cho chủ nghĩa xã hội khoa học.",

function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
